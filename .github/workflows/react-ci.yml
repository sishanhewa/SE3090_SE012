name: React CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/react-app/**'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/react-app/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/react-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend/react-app

      - name: Lint
        run: npm run lint
        working-directory: frontend/react-app

      - name: Run tests
        run: npm run test -- --run
        working-directory: frontend/react-app

      - name: Build
        run: npm run build
        working-directory: frontend/react-app
