name: React CI

on:
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/react-ci.yml'
      - 'frontend/react-app/**'
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/react-ci.yml'
      - 'frontend/react-app/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/react-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend/react-app

      - name: Lint
        run: npm run lint
        working-directory: frontend/react-app

      - name: Run tests
        run: npm run test -- --run --reporter=verbose --reporter=junit --outputFile=test-results.xml
        working-directory: frontend/react-app

      - name: Build
        run: npm run build
        working-directory: frontend/react-app

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: react-ci-test-results
          path: frontend/react-app/test-results.xml
