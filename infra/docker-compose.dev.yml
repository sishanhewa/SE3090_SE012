version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: talentflow-postgres
    environment:
      POSTGRES_DB: talentflow
      POSTGRES_USER: talentflow_user
      POSTGRES_PASSWORD: talentflow_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentflow_user -d talentflow"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
